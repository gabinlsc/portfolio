# Jeux de games.glsc.fr — un conteneur par jeu, accessible uniquement depuis le serveur (127.0.0.1).
# Installé dans /opt/glsc-games par deploy4.sh ; les sources sont dans /opt/glsc-games/src/<jeu>.
# Chaque jeu écrit ses parties terminées dans /var/lib/glsc-games/<jeu>/results.jsonl (seul dossier modifiable),
# lu par la sonde de admin.glsc.fr pour les classements de games.glsc.fr.
name: glsc-games

x-durcissement: &durcissement
  restart: unless-stopped
  read_only: true                 # système de fichiers en lecture seule
  tmpfs: ["/tmp:size=64m"]
  cap_drop: ["ALL"]               # aucun privilège noyau
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  profiles:                       # profils des joueurs (pseudo réservé + cookie) : https://games.glsc.fr/api/profile/
    <<: *durcissement
    image: glsc/profiles:latest
    build:
      context: ./profiles
    environment:
      DATA_DIR: /data
      SITE_DIR: /site
      COOKIE_DOMAIN: .glsc.fr
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}   # bot Discord : à mettre dans /opt/glsc-games/.env (voir le README)
    # /site : les statistiques publiées par la sonde (players.json), en lecture seule, pour les classements d'équipe
    volumes: ["/var/lib/glsc-games/profiles:/data", "/var/www/games.glsc.fr:/site:ro"]
    # 3300 : public (nginx) ; 3301 : interne, appelé par les serveurs de jeu (aussi sur la boucle locale pour Vortex)
    ports: ["127.0.0.1:3300:3300", "127.0.0.1:3301:3301"]
    mem_limit: 128m

  studio:                         # demandes de devis et suivi de projet de studio.glsc.fr (https://studio.glsc.fr/api/)
    <<: *durcissement
    image: glsc/studio:latest
    build:
      context: ./studio
    environment:
      DATA_DIR: /data
      ADMIN_TOKEN_FILE: /run/secrets/studio-token
      RETENTION_DAYS: ${STUDIO_RETENTION_DAYS:-365}
    # Le jeton de l'admin (fichier créé par deploy4, lisible par le groupe www-data) est monté en lecture seule : l'admin PHP l'utilise
    # pour appeler le port 3303, qui n'est jamais exposé par nginx.
    volumes: ["/var/lib/glsc-games/studio:/data", "/etc/glsc-admin/studio-token:/run/secrets/studio-token:ro"]
    group_add: ["${WWW_GID:-33}"]
    ports: ["127.0.0.1:3302:3302", "127.0.0.1:3303:3303"]
    mem_limit: 128m

  uno:                            # +4 (plus4.glsc.fr) : « uno » reste l'identifiant interne du service
    <<: *durcissement
    image: glsc/plus4:latest
    build:
      context: ./src/plus4         # Dockerfile fourni par le dépôt plus4
    environment:
      CORS_ORIGIN: https://plus4.glsc.fr
      RESULTS_FILE: /data/results.jsonl
      PROFILES_URL: http://profiles:3301
    volumes: ["/var/lib/glsc-games/uno:/data"]
    ports: ["127.0.0.1:3101:3001"]
    mem_limit: 512m

  president:
    <<: *durcissement
    image: glsc/president:latest
    build:
      context: ./src/president
      dockerfile: /opt/glsc-games/dockerfiles/president.Dockerfile
    environment:
      CLIENT_ORIGIN: https://president.glsc.fr
      RESULTS_FILE: /data/results.jsonl
      PROFILES_URL: http://profiles:3301
    volumes: ["/var/lib/glsc-games/president:/data"]
    ports: ["127.0.0.1:3102:3001"]
    mem_limit: 512m

  petitbac:                       # Petit Bac (petitbac.glsc.fr)
    <<: *durcissement
    image: glsc/petitbac:latest
    build:
      context: ./src/petitbac      # Dockerfile fourni par le dépôt petitbac
    environment:
      CORS_ORIGIN: https://petitbac.glsc.fr
      RESULTS_FILE: /data/results.jsonl
      PROFILES_URL: http://profiles:3301
    volumes: ["/var/lib/glsc-games/petitbac:/data"]
    ports: ["127.0.0.1:3104:3001"]
    mem_limit: 256m

  vortex:
    <<: *durcissement
    image: glsc/vortex:latest
    build:
      context: ./src/vortex-fps
      dockerfile: /opt/glsc-games/dockerfiles/vortex.Dockerfile
      args:
        GAME_URL: wss://vortex.glsc.fr/play
    # Le serveur Vortex en mode ouvert n'écoute que sur 127.0.0.1 : il partage donc le réseau de l'hôte
    # et reste inaccessible depuis l'extérieur (nginx relaie /play en WebSocket).
    network_mode: host
    environment:
      PORT: "3103"
      ALLOWED_ORIGINS: https://vortex.glsc.fr
      RESULTS_FILE: /data/results.jsonl
    volumes: ["/var/lib/glsc-games/vortex:/data"]
    mem_limit: 1g
