# status.glsc.fr — page de statut statique, status.json régénéré chaque minute par glsc-status.timer.
server {
    listen 443 ssl;
    server_name status.glsc.fr;

    root /var/www/status.glsc.fr;
    index index.html;

    # status.json change chaque minute : jamais de cache
    location = /status.json { expires -1; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }

    ssl_certificate /etc/letsencrypt/live/status.glsc.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.glsc.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name status.glsc.fr;

    # renouvellement du certificat (certbot --webroot)
    location /.well-known/acme-challenge/ { root /var/www/status.glsc.fr; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}
