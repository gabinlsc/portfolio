# Réglages communs à tous les sites de glsc.fr (inclus au niveau http par nginx.conf).
# Note : un bloc server ou location qui définit ses propres add_header n'hérite plus de ceux-ci.

# En-têtes de sécurité
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;

# Page 404 du site (chaque racine contient un 404.html ; sinon nginx garde sa page par défaut)
error_page 404 /404.html;
