# Journal JSON de toutes les requêtes (lu chaque minute par la sonde de admin.glsc.fr).
# Ajouté en plus du access.log habituel ; les sites qui définissent leur propre access_log n'y apparaissent pas.
log_format glsc_json escape=json '{"t":"$time_iso8601","h":"$host","ip":"$remote_addr","s":$status,"m":"$request_method",'
    '"u":"$request_uri","b":$body_bytes_sent,"r":"$http_referer","a":"$http_user_agent","rt":$request_time,"l":"$http_accept_language"}';
access_log /var/log/nginx/glsc-access.log glsc_json;

# Connexion à l'admin : 10 essais par minute et par IP au niveau nginx (le code PHP bloque aussi après 5 échecs).
limit_req_zone $binary_remote_addr zone=glsc_admin_login:1m rate=10r/m;
