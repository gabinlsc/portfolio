# games.glsc.fr : page d'accueil statique de la salle de jeux.
# Les jeux (+4, Président, Vortex) seront ajoutés ici en reverse proxy
# une fois leurs serveurs Node lancés.

server {
    server_name games.glsc.fr;

    root /var/www/games.glsc.fr;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Profils des joueurs (conteneur « profiles », deploy4) : le service fait lui-même sa limitation de débit.
    location /api/profile/ {
        client_max_body_size 16k;   # 16k : les requêtes signées de Discord (/discord)
        proxy_pass http://127.0.0.1:3300/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/games.glsc.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/games.glsc.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = games.glsc.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name games.glsc.fr;
    return 404; # managed by Certbot
}
