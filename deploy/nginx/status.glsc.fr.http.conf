# status.glsc.fr — version HTTP temporaire, le temps d'obtenir le certificat (deploy3.sh).
server {
    listen 80;
    server_name status.glsc.fr;

    root /var/www/status.glsc.fr;
    index index.html;

    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location = /status.json { expires -1; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
